name: Publish site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch site file
        run: curl -L "https://muse.ai/files/1430223946835860/1649158786578344/9aa0wkd1orv2tdorpct9a2ed/digicounts-website.html" -o index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Publish Digicounts site" || echo "nothing to commit"
          git push
